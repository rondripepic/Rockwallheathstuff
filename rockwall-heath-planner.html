<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {

    --tag-english: #dbeafe; --tag-english-text: #1e40af;
    --tag-math: #fef3c7; --tag-math-text: #92400e;
    --tag-science: #d1fae5; --tag-science-text: #065f46;
    --tag-ss: #fce7f3; --tag-ss-text: #9d174d;
    --tag-lote: #ede9fe; --tag-lote-text: #5b21b6;
    --tag-elective: #ffedd5; --tag-elective-text: #9a3412;
    --tag-fine: #fdf4ff; --tag-fine-text: #7e22ce;
    --tag-pe: #ecfdf5; --tag-pe-text: #064e3b;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
    --shadow-drag: 0 8px 30px rgba(0,0,0,.15);
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
  header { background: var(--text); color: #fff; padding: 18px 28px; display: flex; align-items: baseline; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  header h1 { font-family: 'DM Serif Display', serif; font-size: 1.35rem; letter-spacing: -.01em; }
  header span { font-family: 'DM Mono', monospace; font-size: .72rem; color: #9ca3af; letter-spacing: .05em; }
  .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .btn { padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: .8rem; font-weight: 500; transition: all .15s; }
  .btn-outline { background: transparent; color: #d1d5db; border: 1px solid #374151; }
  .btn-outline:hover { border-color: #9ca3af; color: #fff; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #156b45; }
  .app { display: grid; grid-template-columns: 310px 1fr; height: calc(100vh - 57px); }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 16px 18px 10px; border-bottom: 1px solid var(--border); }
  .sidebar-header h2 { font-family: 'DM Serif Display', serif; font-size: 1rem; margin-bottom: 10px; }
  .search-wrap { position: relative; }
  .search-wrap input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: .82rem; background: var(--bg); outline: none; transition: border-color .15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
  .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--border); }
  .filter-tab { padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; font-family: 'DM Sans', sans-serif; font-size: .72rem; cursor: pointer; color: var(--muted); transition: all .12s; white-space: nowrap; }
  .filter-tab.active, .filter-tab:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .course-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
  .course-list::-webkit-scrollbar { width: 4px; }
  .course-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .course-card { padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); cursor: grab; transition: all .15s; user-select: none; display: flex; flex-direction: column; gap: 4px; }
  .course-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
  .course-card.dragging { opacity: .4; cursor: grabbing; }
  .course-card.placed { opacity: .45; background: var(--bg); cursor: default; }
  .course-name { font-size: .82rem; font-weight: 500; line-height: 1.3; }
  .course-meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .tag { font-family: 'DM Mono', monospace; font-size: .65rem; padding: 1px 7px; border-radius: 20px; white-space: nowrap; }
  .grade-tag { font-size: .65rem; color: var(--muted); font-family: 'DM Mono', monospace; }
  .planner { overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .planner-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .planner-top h2 { font-family: 'DM Serif Display', serif; font-size: 1.15rem; }
  .credit-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .credit-pill { padding: 4px 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); font-size: .72rem; font-family: 'DM Mono', monospace; display: flex; gap: 5px; align-items: center; }
  .credit-pill b { color: var(--accent); }
  .grade-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .grade-col { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); }
  .grade-col-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 8px; }
  .grade-col-header h3 { font-family: 'DM Serif Display', serif; font-size: 1rem; }
  .grade-badge { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--muted); }
  .credits-count { margin-left: auto; font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--accent); font-weight: 500; }
  .drop-zone { padding: 10px; min-height: 80px; display: flex; flex-direction: column; gap: 6px; transition: background .15s; }
  .drop-zone.drag-over { background: var(--accent-light); border-radius: 8px; }
  .placed-card { padding: 8px 11px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; cursor: grab; transition: all .15s; user-select: none; animation: pop-in .2s ease; }
  @keyframes pop-in { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .placed-card:hover { border-color: var(--accent2); background: #fff8f7; }
  .placed-card.dragging { opacity: .3; }
  .placed-name { font-size: .78rem; font-weight: 500; line-height: 1.3; flex: 1; }
  .remove-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0; line-height: 1; transition: color .1s; flex-shrink: 0; }
  .remove-btn:hover { color: var(--accent2); }
  .drop-hint { color: var(--muted); font-size: .72rem; text-align: center; padding: 12px 0; border: 1.5px dashed var(--border); border-radius: 6px; }
  .cat-english { --tag-bg: var(--tag-english); --tag-c: var(--tag-english-text); }
  .cat-math { --tag-bg: var(--tag-math); --tag-c: var(--tag-math-text); }
  .cat-science { --tag-bg: var(--tag-science); --tag-c: var(--tag-science-text); }
  .cat-ss { --tag-bg: var(--tag-ss); --tag-c: var(--tag-ss-text); }
  .cat-lote { --tag-bg: var(--tag-lote); --tag-c: var(--tag-lote-text); }
  .cat-fine { --tag-bg: var(--tag-fine); --tag-c: var(--tag-fine-text); }
  .cat-pe { --tag-bg: var(--tag-pe); --tag-c: var(--tag-pe-text); }
  .cat-elective { --tag-bg: var(--tag-elective); --tag-c: var(--tag-elective-text); }
  .tag { background: var(--tag-bg, #f3f4f6); color: var(--tag-c, var(--muted)); }
  .placed-card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tag-bg, #d1d5db); flex-shrink: 0; margin-top: 4px; }
  .drag-ghost { position: fixed; top: -1000px; left: -1000px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 8px 12px; font-family: 'DM Sans', sans-serif; font-size: .82rem; font-weight: 500; box-shadow: var(--shadow-drag); pointer-events: none; z-index: 9999; max-width: 220px; }
  .empty-state { text-align: center; color: var(--muted); font-size: .82rem; padding: 20px; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; height: auto; } .sidebar { height: 300px; } .grade-grid { grid-template-columns: repeat(2,1fr); } }
</style>
</head>

</div>

let plan = {9:[],10:[],11:[],12:[]};
let activeFilter = 'all';
let dragSource = null;

function init() {
  try { const s = localStorage.getItem('rh_plan_27'); if (s) plan = JSON.parse(s); } catch(e){}
  renderSidebar(); renderPlanner(); updateCredits();
}

function savePlan() {
  try { localStorage.setItem('rh_plan_27', JSON.stringify(plan)); showToast('Plan saved!'); } catch(e){ showToast('Could not save.'); }
}

function clearAll() {
  if (!confirm('Clear your entire plan?')) return;
  plan = {9:[],10:[],11:[],12:[]};
  renderSidebar(); renderPlanner(); updateCredits(); savePlan();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {position:'fixed',bottom:'24px',right:'24px',background:'#1a1714',color:'#fff',padding:'10px 18px',borderRadius:'8px',fontFamily:"'DM Sans',sans-serif",fontSize:'.82rem',boxShadow:'0 4px 16px rgba(0,0,0,.2)',zIndex:9999,transition:'opacity .3s'});
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 1800);
}

function setCat(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterCourses();
}

function filterCourses() { renderSidebar(document.getElementById('search').value.toLowerCase().trim()); }

function getPlacedIds() { return new Set([...plan[9],...plan[10],...plan[11],...plan[12]]); }

function renderSidebar(q='') {
  const list = document.getElementById('courseList');
  const placed = getPlacedIds();
  let courses = COURSES.filter(c => {
    if (activeFilter !== 'all' && c.cat !== activeFilter) return false;
    if (q && !c.name.toLowerCase().includes(q)) return false;
    return true;
  });
  courses.sort((a,b) => {
    const ap=placed.has(a.id), bp=placed.has(b.id);
    if (ap!==bp) return ap?1:-1;
    return a.name.localeCompare(b.name);
  });
  list.innerHTML = '';
  if (!courses.length) { list.innerHTML='<div class="empty-state">No courses found.</div>'; return; }
  courses.forEach(c => {
    const isPlaced = placed.has(c.id);
    const div = document.createElement('div');
    div.className = `course-card cat-${c.cat}${isPlaced?' placed':''}`;
    div.draggable = !isPlaced;
    div.dataset.id = c.id;
    div.innerHTML = `<div class="course-name">${c.name}</div><div class="course-meta"><span class="tag">${CAT_LABELS[c.cat]}</span><span class="grade-tag">Gr ${c.grades.join(', ')} · ${c.credits} cr</span>${isPlaced?'<span class="grade-tag">✓ placed</span>':''}</div>`;
    if (!isPlaced) {
      div.addEventListener('dragstart', e => onDragStart(e, c.id, 'sidebar'));
      div.addEventListener('dragend', onDragEnd);
    }
    list.appendChild(div);
  });
}

function renderPlanner() {
  const grid = document.getElementById('gradeGrid');
  grid.innerHTML = '';
  GRADES.forEach(g => {
    const col = document.createElement('div');
    col.className = 'grade-col';
    col.innerHTML = `<div class="grade-col-header"><h3>${GRADE_NAMES[g]}</h3><span class="grade-badge">Grade ${g}</span><span class="credits-count" id="credits-${g}">0 cr</span></div>`;
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    zone.dataset.grade = g;
    zone.addEventListener('dragover', e => onDragOver(e, g));
    zone.addEventListener('dragleave', e => { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over'); });
    zone.addEventListener('drop', e => onDrop(e, g));
    if (plan[g].length === 0) {
      zone.innerHTML = '<div class="drop-hint">Drop courses here</div>';
    } else {
      plan[g].forEach(cid => {
        const course = COURSES.find(c => c.id === cid);
        if (course) zone.appendChild(makePlacedCard(course, g));
      });
    }
    col.appendChild(zone);
    grid.appendChild(col);
  });
  updateCredits();
}

function makePlacedCard(course, grade) {
  const div = document.createElement('div');
  div.className = `placed-card cat-${course.cat}`;
  div.draggable = true;
  div.dataset.id = course.id;
  div.innerHTML = `<div class="dot"></div><span class="placed-name">${course.name}</span><button class="remove-btn" title="Remove" onclick="removeCourse('${course.id}',${grade})">✕</button>`;
  div.addEventListener('dragstart', e => onDragStart(e, course.id, grade));
  div.addEventListener('dragend', onDragEnd);
  return div;
}

function removeCourse(cid, grade) {
  plan[grade] = plan[grade].filter(id => id !== cid);
  renderPlanner();
  renderSidebar(document.getElementById('search').value.toLowerCase().trim());
}

function updateCredits() {
  let total = 0;
  let ibctotal =0;
  const cats = {};
  GRADES.forEach(g => {
    const credits = plan[g].reduce((sum, cid) => {
      const c = COURSES.find(x => x.id === cid);
      if (c) {
        cats[c.cat] = (cats[c.cat]||0) + c.credits;

        if (c.ibc) {
          ibcTotal += c.ibc;
        }
      }
      return sum + (c ? c.credits : 0);
    }, 0);
    total += credits;
    const el = document.getElementById(`credits-${g}`);
    if (el) el.textContent = `${credits} cr`;
  });
  const summary = document.getElementById('creditSummary');
  summary.innerHTML = `<div class="credit-pill">Total <b>${total}</b> cr</div>` + `<div class="credit-pill"> IBC <b>${ibcTotal}</b> </div>`
    Object.entries(cats).map(([k,v])=>`<div class="credit-pill cat-${k}"><span class="tag">${CAT_LABELS[k]}</span><b>${v}</b></div>`).join('');
}

function onDragStart(e, courseId, from) {
  dragSource = {id:courseId, from};
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', courseId);
  const ghost = document.getElementById('dragGhost');
  const course = COURSES.find(c=>c.id===courseId);
  ghost.textContent = course ? course.name : '';
  e.dataTransfer.setDragImage(ghost, 0, 0);
  setTimeout(() => { if(e.target.classList.contains('course-card')||e.target.classList.contains('placed-card')) e.target.classList.add('dragging'); }, 0);
}

function onDragEnd() {
  document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  dragSource = null;
}

function onDragOver(e, grade) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onDrop(e, grade) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSource) return;
  const {id, from} = dragSource;
  if (typeof from === 'number') plan[from] = plan[from].filter(cid=>cid!==id);
  if (!plan[grade].includes(id)) plan[grade] = [...plan[grade], id];
  dragSource = null;
  renderPlanner();
  renderSidebar(document.getElementById('search').value.toLowerCase().trim());
  savePlan();
}

init();
</script>
</body>
</html>
