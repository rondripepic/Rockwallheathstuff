/* =========================
   STATE
========================= */

let plan = {9:[],10:[],11:[],12:[]};
let activeFilter = 'all';
let dragSource = null;


/* =========================
   INIT
========================= */

function init() {
  loadPlan();
  renderAll();
}

function renderAll() {
  renderSidebar();
  renderPlanner();
  updateCredits();
}


/* =========================
   STORAGE
========================= */

function savePlan() {
  localStorage.setItem('rh_plan_27', JSON.stringify(plan));
  showToast('Plan saved!');
}

function loadPlan() {
  try {
    const saved = localStorage.getItem('rh_plan_27');
    if (saved) plan = JSON.parse(saved);
  } catch (e) {}
}


/* =========================
   UI HELPERS
========================= */

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;

  Object.assign(t.style, {
    position:'fixed',bottom:'24px',right:'24px',
    background:'#111',color:'#fff',padding:'10px 16px',
    borderRadius:'8px',fontSize:'12px',zIndex:9999
  });

  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function getPlacedIds() {
  return new Set(Object.values(plan).flat());
}


/* =========================
   SIDEBAR
========================= */

function renderSidebar(query = '') {
  const list = document.getElementById('courseList');
  const placed = getPlacedIds();

  const q = query.toLowerCase();

  const filtered = COURSES.filter(c => {
    if (activeFilter !== 'all' && c.cat !== activeFilter) return false;
    if (q && !c.name.toLowerCase().includes(q)) return false;
    return true;
  });

  list.innerHTML = '';

  filtered.forEach(course => {
    const isPlaced = placed.has(course.id);

    const el = document.createElement('div');
    el.className = `course-card cat-${course.cat} ${isPlaced ? 'placed' : ''}`;
    el.draggable = !isPlaced;

    el.innerHTML = `
      <div class="course-name">${course.name}</div>
      <div class="course-meta">
        <span class="tag">${CAT_LABELS[course.cat]}</span>
        <span class="grade-tag">
          Gr ${course.grades.join(', ')} · ${course.credits} cr
        </span>
        ${isPlaced ? '<span class="grade-tag">✓ placed</span>' : ''}
      </div>
    `;

    if (!isPlaced) {
      el.addEventListener('dragstart', e => onDragStart(e, course.id, 'sidebar'));
      el.addEventListener('dragend', onDragEnd);
    }

    list.appendChild(el);
  });
}


/* =========================
   PLANNER
========================= */

function renderPlanner() {
  const grid = document.getElementById('gradeGrid');
  grid.innerHTML = '';

  GRADES.forEach(grade => {
    const col = document.createElement('div');
    col.className = 'grade-col';

    const courses = plan[grade];

    col.innerHTML = `
      <div class="grade-col-header">
        <h3>${GRADE_NAMES[grade]}</h3>
        <span class="credits-count" id="credits-${grade}">0 cr</span>
      </div>
    `;

    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    zone.dataset.grade = grade;

    zone.addEventListener('dragover', onDragOver);
    zone.addEventListener('dragleave', onDragLeave);
    zone.addEventListener('drop', e => onDrop(e, grade));

    if (courses.length === 0) {
      zone.innerHTML = `<div class="drop-hint">Drop courses here</div>`;
    } else {
      courses.forEach(id => {
        const course = COURSES.find(c => c.id === id);
        if (course) zone.appendChild(createPlacedCard(course, grade));
      });
    }

    col.appendChild(zone);
    grid.appendChild(col);
  });

  updateCredits();
}


/* =========================
   CARDS
========================= */

function createPlacedCard(course, grade) {
  const el = document.createElement('div');
  el.className = `placed-card cat-${course.cat}`;
  el.draggable = true;

  el.innerHTML = `
    <div class="dot"></div>
    <span class="placed-name">${course.name}</span>
    <button class="remove-btn">✕</button>
  `;

  el.querySelector('.remove-btn')
    .addEventListener('click', () => removeCourse(course.id, grade));

  el.addEventListener('dragstart', e => onDragStart(e, course.id, grade));
  el.addEventListener('dragend', onDragEnd);

  return el;
}


/* =========================
   MODIFY PLAN
========================= */

function removeCourse(id, grade) {
  plan[grade] = plan[grade].filter(c => c !== id);
  renderAll();
  savePlan();
}


/* =========================
   DRAG & DROP
========================= */

function onDragStart(e, id, from) {
  dragSource = { id, from };

  const ghost = document.getElementById('dragGhost');
  const course = COURSES.find(c => c.id === id);

  ghost.textContent = course?.name || '';
  e.dataTransfer.setDragImage(ghost, 0, 0);

  e.dataTransfer.setData('text/plain', id);
}

function onDragEnd() {
  dragSource = null;
  document.querySelectorAll('.drag-over').forEach(e => e.classList.remove('drag-over'));
}

function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onDrop(e, grade) {
  e.preventDefault();

  const { id, from } = dragSource || {};
  if (!id) return;

  if (typeof from === 'number') {
    plan[from] = plan[from].filter(c => c !== id);
  }

  if (!plan[grade].includes(id)) {
    plan[grade].push(id);
  }

  dragSource = null;

  renderAll();
  savePlan();
}


/* =========================
   CREDITS (FIXED)
========================= */

function updateCredits() {
  let total = 0;
  const categoryTotals = {};

  GRADES.forEach(g => {
    let gradeTotal = 0;

    plan[g].forEach(id => {
      const c = COURSES.find(x => x.id === id);
      if (!c) return;

      gradeTotal += c.credits;
      total += c.credits;

      categoryTotals[c.cat] = (categoryTotals[c.cat] || 0) + c.credits;
    });

    const el = document.getElementById(`credits-${g}`);
    if (el) el.textContent = `${gradeTotal} cr`;
  });

  const summary = document.getElementById('creditSummary');

  summary.innerHTML =
    `<div class="credit-pill">Total <b>${total}</b> cr</div>` +
    Object.entries(categoryTotals)
      .map(([k,v]) =>
        `<div class="credit-pill cat-${k}">
          <span class="tag">${CAT_LABELS[k]}</span>
          <b>${v}</b>
        </div>`
      ).join('');
}


/* =========================
   FILTER HOOKS (unchanged behavior)
========================= */

function setCat(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.filter-tab')
    .forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  renderSidebar(document.getElementById('search').value);
}

function filterCourses() {
  renderSidebar(document.getElementById('search').value);
}


/* =========================
   ACTIONS
========================= */

function clearAll() {
  if (!confirm('Clear your entire plan?')) return;
  plan = {9:[],10:[],11:[],12:[]};
  renderAll();
  savePlan();
}


/* =========================
   START
========================= */

init();
</script>
